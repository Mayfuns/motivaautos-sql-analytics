name: Add MotivaAutos project preview

on:
  push:
    paths:
      - '.github/workflows/add-motivaautos-preview.yml'

permissions:
  contents: write

jobs:
  add-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download preview image
        shell: bash
        run: |
          set -e
          mkdir -p 04_results
          curl -L --fail             "https://raw.githubusercontent.com/Mayfuns/mariam-analytics-portfolio/main/assets/images/motivaautos.png"             -o "04_results/project-preview.png"

      - name: Commit preview image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_results/project-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Add MotivaAutos project preview"
            git push
          fi
